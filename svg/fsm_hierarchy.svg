<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .base-class { fill: #f4e4bc; stroke: #8b4513; stroke-width: 3; rx: 10; ry: 10; }
      .derived-class { fill: #e6f2ff; stroke: #4682b4; stroke-width: 2; rx: 8; ry: 8; }
      .text { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; cursor: pointer; }
      .class-name { font-weight: bold; font-size: 14px; }
      .arrow { marker-end: url(#arrowhead); stroke: #333; stroke-width: 2; fill: none; }
      .hierarchy-label { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="800" y="30" class="text" style="font-size: 18px; font-weight: bold;">FSM::CoreAST Class Hierarchy</text>
  
  <!-- Hierarchy Section Labels -->
  <text x="120" y="65" class="hierarchy-label">AST Nodes</text>
  <text x="520" y="65" class="hierarchy-label">Expressions</text>
  <text x="920" y="65" class="hierarchy-label">Actions</text>
  <text x="1220" y="65" class="hierarchy-label">Control Flow</text>
  <text x="400" y="545" class="hierarchy-label">Core FSM Components</text>
  
  <!-- AST NODE HIERARCHY (Left Section) -->
  <!-- ASTNode Base -->
  <rect class="base-class" x="50" y="80" width="140" height="60"/>
  <text x="120" y="105" class="text class-name">ASTNode</text>
  <text x="120" y="120" class="text">(Base AST)</text>
  
  <!-- ASTNode Derived Classes -->
  <rect class="derived-class" x="10" y="180" width="110" height="50"/>
  <text x="65" y="200" class="text">PrimaryGate</text>
  <text x="65" y="215" class="text">(Logic Gates)</text>
  
  <rect class="derived-class" x="130" y="180" width="110" height="50"/>
  <text x="185" y="200" class="text">Sequential</text>
  <text x="185" y="215" class="text">(Flip-Flops)</text>
  
  <rect class="derived-class" x="250" y="180" width="110" height="50"/>
  <text x="305" y="200" class="text">UserDefinedBlock</text>
  <text x="305" y="215" class="text">(Modules)</text>
  
  <!-- EXPRESSION HIERARCHY (Center-Left Section) -->
  <!-- Expression Base -->
  <rect class="base-class" x="450" y="80" width="140" height="60"/>
  <text x="520" y="105" class="text class-name">Expression</text>
  <text x="520" y="120" class="text">(Base Expr)</text>
  
  <!-- Expression Derived Classes Row 1 -->
  <rect class="derived-class" x="380" y="180" width="90" height="50"/>
  <text x="425" y="200" class="text">SignalRef</text>
  <text x="425" y="215" class="text">(Signal)</text>
  
  <rect class="derived-class" x="480" y="180" width="90" height="50"/>
  <text x="525" y="200" class="text">Literal</text>
  <text x="525" y="215" class="text">(Constants)</text>
  
  <rect class="derived-class" x="580" y="180" width="90" height="50"/>
  <text x="625" y="200" class="text">BinaryOp</text>
  <text x="625" y="215" class="text">(+,-,&amp;,|)</text>
  
  <!-- Expression Derived Classes Row 2 -->
  <rect class="derived-class" x="380" y="250" width="90" height="50"/>
  <text x="425" y="270" class="text">UnaryOp</text>
  <text x="425" y="285" class="text">(!,~,-)</text>
  
  <rect class="derived-class" x="480" y="250" width="90" height="50"/>
  <text x="525" y="270" class="text">Concatenation</text>
  <text x="525" y="285" class="text">({a,b,c})</text>
  
  <rect class="derived-class" x="580" y="250" width="90" height="50"/>
  <text x="625" y="270" class="text">IndexedRef</text>
  <text x="625" y="285" class="text">(a[i])</text>
  
  <!-- Expression Derived Classes Row 3 -->
  <rect class="derived-class" x="380" y="320" width="90" height="50"/>
  <text x="425" y="340" class="text">Conditional</text>
  <text x="425" y="355" class="text">(a?b:c)</text>
  
  <rect class="derived-class" x="480" y="320" width="90" height="50"/>
  <text x="525" y="340" class="text">FunctionCall</text>
  <text x="525" y="355" class="text">(func(args))</text>
  
  <!-- ACTION HIERARCHY (Center-Right Section) -->
  <!-- Action Base -->
  <rect class="base-class" x="750" y="80" width="140" height="60"/>
  <text x="820" y="105" class="text class-name">Action</text>
  <text x="820" y="120" class="text">(Base Action)</text>
  
  <!-- Action Derived Classes Row 1 -->
  <rect class="derived-class" x="680" y="180" width="110" height="50"/>
  <text x="735" y="200" class="text">Assignment</text>
  <text x="735" y="215" class="text">(Base Assign)</text>
  
  <rect class="derived-class" x="800" y="180" width="110" height="50"/>
  <text x="855" y="200" class="text">StateTransition</text>
  <text x="855" y="215" class="text">(State Change)</text>
  
  <rect class="derived-class" x="920" y="180" width="110" height="50"/>
  <text x="975" y="200" class="text">SideEffect</text>
  <text x="975" y="215" class="text">(Debug/Misc)</text>
  
  <!-- Assignment Subtypes Row 1 -->
  <rect class="derived-class" x="580" y="280" width="100" height="45"/>
  <text x="630" y="298" class="text">RegisterAssign</text>
  <text x="630" y="313" class="text">(Clocked)</text>
  
  <rect class="derived-class" x="690" y="280" width="100" height="45"/>
  <text x="740" y="298" class="text">MuxOutput</text>
  <text x="740" y="313" class="text">(Comb Mux)</text>
  
  <rect class="derived-class" x="800" y="280" width="100" height="45"/>
  <text x="850" y="298" class="text">PulseAssign</text>
  <text x="850" y="313" class="text">(N-cycle)</text>
  
  <!-- Assignment Subtypes Row 2 -->
  <rect class="derived-class" x="580" y="340" width="100" height="45"/>
  <text x="630" y="358" class="text">CombiAssign</text>
  <text x="630" y="373" class="text">(Pure Comb)</text>
  
  <rect class="derived-class" x="690" y="340" width="100" height="45"/>
  <text x="740" y="358" class="text">RegisterMux</text>
  <text x="740" y="373" class="text">(Reg+Mux)</text>
  
  <rect class="derived-class" x="800" y="340" width="100" height="45"/>
  <text x="850" y="358" class="text">MuxRegister</text>
  <text x="850" y="373" class="text">(Mux+Reg)</text>
  
  <!-- Assignment Subtypes Row 3 -->
  <rect class="derived-class" x="580" y="400" width="100" height="45"/>
  <text x="630" y="418" class="text">Increment</text>
  <text x="630" y="433" class="text">(Auto++)</text>
  
  <rect class="derived-class" x="690" y="400" width="100" height="45"/>
  <text x="740" y="418" class="text">Decrement</text>
  <text x="740" y="433" class="text">(Auto--)</text>
  
  <!-- CONTROL FLOW HIERARCHY (Right Section) -->
  <!-- ControlFlow Base -->
  <rect class="base-class" x="1120" y="80" width="140" height="60"/>
  <text x="1190" y="105" class="text class-name">ControlFlow</text>
  <text x="1190" y="120" class="text">(Base Control)</text>
  
  <!-- ControlFlow Derived Classes -->
  <rect class="derived-class" x="1070" y="180" width="120" height="50"/>
  <text x="1130" y="200" class="text">ConditionalBranch</text>
  <text x="1130" y="215" class="text">(if/else)</text>
  
  <rect class="derived-class" x="1200" y="180" width="100" height="50"/>
  <text x="1250" y="200" class="text">TestNode</text>
  <text x="1250" y="215" class="text">(case/when)</text>
  
  <!-- CORE FSM COMPONENTS (Bottom Section) -->
  <rect class="derived-class" x="100" y="580" width="120" height="50"/>
  <text x="160" y="600" class="text">DecisionTree</text>
  <text x="160" y="615" class="text">(Core DT)</text>
  
  <rect class="derived-class" x="240" y="580" width="100" height="50"/>
  <text x="290" y="600" class="text">State</text>
  <text x="290" y="615" class="text">(FSM State)</text>
  
  <rect class="derived-class" x="360" y="580" width="120" height="50"/>
  <text x="420" y="600" class="text">FSMModule</text>
  <text x="420" y="615" class="text">(Complete FSM)</text>
  
  <rect class="derived-class" x="500" y="580" width="100" height="50"/>
  <text x="550" y="600" class="text">Signal</text>
  <text x="550" y="615" class="text">(Wire/Reg)</text>
  
  <rect class="derived-class" x="620" y="580" width="100" height="50"/>
  <text x="670" y="600" class="text">Port</text>
  <text x="670" y="615" class="text">(I/O Port)</text>
  
  <!-- INHERITANCE ARROWS -->
  
  <!-- ASTNode to its children -->
  <line class="arrow" x1="120" y1="140" x2="65" y2="180"/>
  <line class="arrow" x1="120" y1="140" x2="185" y2="180"/>
  <line class="arrow" x1="120" y1="140" x2="305" y2="180"/>
  
  <!-- Expression to its children -->
  <line class="arrow" x1="520" y1="140" x2="425" y2="180"/>
  <line class="arrow" x1="520" y1="140" x2="525" y2="180"/>
  <line class="arrow" x1="520" y1="140" x2="625" y2="180"/>
  <line class="arrow" x1="520" y1="140" x2="425" y2="250"/>
  <line class="arrow" x1="520" y1="140" x2="525" y2="250"/>
  <line class="arrow" x1="520" y1="140" x2="625" y2="250"/>
  <line class="arrow" x1="520" y1="140" x2="425" y2="320"/>
  <line class="arrow" x1="520" y1="140" x2="525" y2="320"/>
  
  <!-- Action to its children -->
  <line class="arrow" x1="820" y1="140" x2="735" y2="180"/>
  <line class="arrow" x1="820" y1="140" x2="855" y2="180"/>
  <line class="arrow" x1="820" y1="140" x2="975" y2="180"/>
  
  <!-- Assignment to its subtypes -->
  <line class="arrow" x1="735" y1="230" x2="630" y2="280"/>
  <line class="arrow" x1="735" y1="230" x2="740" y2="280"/>
  <line class="arrow" x1="735" y1="230" x2="850" y2="280"/>
  <line class="arrow" x1="735" y1="230" x2="630" y2="340"/>
  <line class="arrow" x1="735" y1="230" x2="740" y2="340"/>
  <line class="arrow" x1="735" y1="230" x2="850" y2="340"/>
  <line class="arrow" x1="735" y1="230" x2="630" y2="400"/>
  <line class="arrow" x1="735" y1="230" x2="740" y2="400"/>
  
  <!-- ControlFlow to its children -->
  <line class="arrow" x1="1190" y1="140" x2="1130" y2="180"/>
  <line class="arrow" x1="1190" y1="140" x2="1250" y2="180"/>
  
  <!-- Click handlers (invisible overlay rects for interactivity) -->
  <rect x="380" y="180" width="90" height="50" fill="transparent" cursor="pointer" onclick="window.open('coreast_signalref_details.html', '_blank')"/>
  
</svg>
